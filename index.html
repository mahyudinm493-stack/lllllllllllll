<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undangan Pernikahan — Andi Indah &amp; Baso' Akbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #18080a;
      --bg-cream: #fbf7f1;
      --surface: #ffffff;
      --maroon: #62171e;
      --maroon-deep: #38090e;
      --gold: #c4984e;
      --gold-light: #f0d7a3;
      --ink: #241815;
      --muted: #6c5b53;
      --border-gold: rgba(196, 152, 78, 0.36);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-cream);
      background-image:
        radial-gradient(rgba(196, 152, 78, 0.16) 1px, transparent 1px),
        radial-gradient(rgba(98, 23, 30, 0.06) 1px, var(--bg-cream) 1px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.7;
      overflow-x: hidden;
    }

    body.locked {
      overflow: hidden;
    }

    .display-font {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.06em;
    }

    h1, h2, h3, .serif {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
    }

    .motif-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 14px auto 0;
      max-width: 260px;
    }

    .motif-divider::before,
    .motif-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .diamond-motif {
      width: 9px;
      height: 9px;
      transform: rotate(45deg);
      border: 1.5px solid var(--gold);
      background: var(--maroon);
      box-shadow: 0 0 0 3px rgba(196, 152, 78, 0.16);
    }

    /* =========================================================================
       1. SAMPUL DEPAN BERMOTIF & FOTO
       ========================================================================= */
    .cover-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      transition: transform 0.95s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.85s ease;
    }

    .cover-screen.opened {
      transform: translateY(-105%);
      opacity: 0;
      pointer-events: none;
    }

    .cover-bg {
      position: absolute;
      inset: 0;
      background: url('3_2.png') center 18% / cover no-repeat;
      transform: scale(1.05);
      animation: coverBreath 14s ease-in-out infinite alternate;
      filter: brightness(0.52) contrast(1.06);
    }

    @keyframes coverBreath {
      from { transform: scale(1.03); }
      to { transform: scale(1.12); }
    }

    .cover-pattern {
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(45deg, rgba(240, 215, 163, 0.05) 0px, rgba(240, 215, 163, 0.05) 1px, transparent 1px, transparent 22px),
        repeating-linear-gradient(-45deg, rgba(240, 215, 163, 0.05) 0px, rgba(240, 215, 163, 0.05) 1px, transparent 1px, transparent 22px);
      pointer-events: none;
    }

    .cover-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(56, 9, 14, 0.28) 0%, rgba(16, 5, 7, 0.90) 100%);
    }

    .cover-card {
      position: relative;
      z-index: 2;
      width: min(90vw, 550px);
      padding: 40px 26px;
      border-radius: 220px 220px 26px 26px;
      border: 1.5px solid rgba(240, 215, 163, 0.55);
      background: rgba(24, 7, 10, 0.48);
      backdrop-filter: blur(5px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 0 0 6px rgba(196, 152, 78, 0.14);
    }

    .cover-eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 12px;
    }

    .cover-title {
      font-size: clamp(2rem, 5.4vw, 3.15rem);
      line-height: 1.15;
      color: #fff;
    }

    .cover-amp {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--gold-light);
      font-size: 0.78em;
      margin: 4px 0;
    }

    .cover-date {
      margin-top: 16px;
      font-size: 0.9rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f8ebd2;
    }

    .open-btn {
      margin-top: 26px;
      padding: 13px 30px;
      border-radius: 999px;
      border: 1px solid var(--gold-light);
      background: linear-gradient(135deg, #be8e3f 0%, #7d5218 100%);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      transition: transform 0.22s ease;
    }

    .open-btn:hover {
      transform: translateY(-2px);
    }

    /* =========================================================================
       2. HERO BANNER UTAMA BERMOTIF
       ========================================================================= */
    .hero-banner {
      position: relative;
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 72px 20px;
      color: #fff;
      overflow: hidden;
      background: var(--maroon-deep);
    }

    .hero-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url('5_2.png') center 18% / cover no-repeat;
      opacity: 0.32;
      transform: scale(1.04);
    }

    .hero-banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(45deg, rgba(240, 215, 163, 0.04) 0px, rgba(240, 215, 163, 0.04) 1px, transparent 1px, transparent 26px),
        linear-gradient(to bottom, rgba(38, 7, 11, 0.72) 0%, rgba(56, 9, 14, 0.82) 65%, var(--bg-cream) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 720px;
    }

    .bismillah {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.25rem;
      color: var(--gold-light);
      margin-bottom: 10px;
    }

    .hero-content h1 {
      font-size: clamp(2.15rem, 5.5vw, 3.8rem);
      line-height: 1.14;
      color: #fff;
    }

    .hero-content .amp-gold {
      display: block;
      font-style: italic;
      color: var(--gold-light);
      font-size: 0.74em;
      margin: 6px 0;
    }

    .hero-quote {
      margin: 20px auto 0;
      max-width: 580px;
      font-size: 0.94rem;
      color: rgba(255, 255, 255, 0.9);
    }

    .countdown-wrap {
      display: grid;
      grid-template-columns: repeat(4, minmax(64px, 92px));
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .cd-box {
      background: rgba(22, 6, 8, 0.62);
      border: 1px solid rgba(240, 215, 163, 0.42);
      border-radius: 14px;
      padding: 12px 8px;
      backdrop-filter: blur(4px);
    }

    .cd-num {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold-light);
      line-height: 1.1;
    }

    .cd-label {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 4px;
    }

    .container {
      max-width: 840px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .section-block {
      padding: 58px 0;
    }

    .section-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .section-kicker {
      font-size: 0.74rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .section-header h2 {
      font-size: clamp(2rem, 4.4vw, 2.85rem);
      color: var(--maroon);
      margin-bottom: 6px;
    }

    .section-header p {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 560px;
      margin: 12px auto 0;
    }

    /* =========================================================================
       3. PROFIL MEMPELAI BERMOTIF
       ========================================================================= */
    .couple-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 24px;
    }

    .person-card {
      position: relative;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.97) 0%, rgba(252, 247, 239, 0.97) 100%);
      border: 1px solid var(--border-gold);
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 14px 34px rgba(56, 9, 14, 0.06);
    }

    .person-avatar {
      width: 148px;
      height: 184px;
      margin: 0 auto 18px;
      border-radius: 90px 90px 18px 18px;
      overflow: hidden;
      border: 3px solid var(--gold);
      box-shadow: 0 0 0 4px rgba(196, 152, 78, 0.16), 0 10px 24px rgba(56, 9, 14, 0.14);
    }

    .person-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
    }

    .person-card h3 {
      font-size: 1.65rem;
      color: var(--maroon);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .person-card p {
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* =========================================================================
       4. JADWAL ACARA & LOKASI
       ========================================================================= */
    .event-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .event-card {
      background:
        repeating-linear-gradient(135deg, rgba(196, 152, 78, 0.03) 0px, rgba(196, 152, 78, 0.03) 10px, transparent 10px, transparent 20px),
        #ffffff;
      border: 1px solid var(--border-gold);
      border-radius: 22px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 14px 34px rgba(56, 9, 14, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .event-card h3 {
      font-size: 1.85rem;
      color: var(--maroon);
      margin-bottom: 10px;
    }

    .event-card p {
      font-size: 0.93rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .btn-gold {
      display: inline-block;
      margin-top: 16px;
      padding: 11px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-deep) 100%);
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 8px 20px rgba(98, 23, 30, 0.22);
      transition: transform 0.2s ease;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
    }

    /* =========================================================================
       5. GALERI FOTO PENUH VARIASI + TEKS MELUNCUR KE ATAS FOTO
       ========================================================================= */
    .story-stack {
      display: flex;
      flex-direction: column;
      gap: 52px;
    }

    .photo-story-card {
      position: relative;
      overflow: hidden;
      background: #1a0a0c;
      min-height: 510px;
      box-shadow: 0 22px 50px rgba(36, 15, 17, 0.16);
      --lift: 64px;
      --fade: 0.15;
      --p: 0;
      --img-scale: 1.06;
      --img-x: 0%;
      --img-rot: 0deg;
    }

    .photo-story-card[data-frame="arch"] {
      border-radius: 190px 190px 26px 26px;
      border: 2px solid var(--gold);
    }

    .photo-story-card[data-frame="bevel"] {
      border-radius: 42px 8px 42px 8px;
      border: 1px solid var(--border-gold);
    }

    .photo-story-card[data-frame="classic"] {
      border-radius: 26px;
      border: 1px solid var(--border-gold);
    }

    .photo-story-card[data-frame="reverse-bevel"] {
      border-radius: 8px 42px 8px 42px;
      border: 1px solid var(--border-gold);
    }

    .photo-story-card[data-frame="double-border"] {
      border-radius: 28px;
      padding: 10px;
      background: linear-gradient(135deg, #4b1218, #24080b);
      border: 1px solid var(--gold);
    }

    .photo-story-card[data-frame="double-border"] img {
      border-radius: 20px;
    }

    .photo-story-card[data-frame="royal-pill"] {
      border-radius: 34px;
      border: 2px solid rgba(196, 152, 78, 0.55);
    }

    .photo-story-card[data-frame="ornate-arch"] {
      border-radius: 160px 26px 160px 26px;
      border: 2px solid var(--gold);
    }

    .photo-story-card[data-variant="zoom-in"] {
      --img-scale: calc(1.03 + var(--p) * 0.11);
    }

    .photo-story-card[data-variant="pan-right"] {
      --img-scale: 1.13;
      --img-x: calc(-4% + var(--p) * 7%);
    }

    .photo-story-card[data-variant="tilt-soft"] {
      --img-scale: 1.10;
      --img-rot: calc(-1.3deg + var(--p) * 2.6deg);
    }

    .photo-story-card[data-variant="zoom-out"] {
      --img-scale: calc(1.16 - var(--p) * 0.11);
    }

    .photo-story-card[data-variant="pan-left"] {
      --img-scale: 1.13;
      --img-x: calc(4% - var(--p) * 7%);
    }

    .photo-story-card[data-variant="zoom-tilt"] {
      --img-scale: calc(1.04 + var(--p) * 0.09);
      --img-rot: calc(1.1deg - var(--p) * 2.2deg);
    }

    .photo-story-card img {
      width: 100%;
      height: 570px;
      object-fit: cover;
      object-position: center 18%;
      display: block;
      transform: translateX(var(--img-x)) scale(var(--img-scale)) rotate(var(--img-rot));
      transition: transform 0.18s ease-out;
      will-change: transform;
    }

    .photo-story-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(20, 7, 9, 0.94) 0%,
        rgba(20, 7, 9, 0.56) 46%,
        rgba(20, 7, 9, 0.06) 100%
      );
      pointer-events: none;
    }

    .overlay-text {
      position: relative;
      z-index: 2;
      margin-top: -215px;
      padding: 28px 28px 32px;
      color: #fff;
      transform: translateY(var(--lift));
      opacity: var(--fade);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease-out;
      will-change: transform, opacity;
    }

    .photo-story-card[data-align="left-ribbon"] .overlay-text {
      text-align: left;
      max-width: 92%;
    }

    .photo-story-card[data-align="center-badge"] .overlay-text {
      text-align: center;
      margin-left: auto;
      margin-right: auto;
      max-width: 88%;
    }

    .photo-story-card[data-align="glass-editorial"] .overlay-text {
      text-align: left;
      margin-left: 22px;
      margin-right: 22px;
      padding: 20px 22px;
      border-left: 4px solid var(--gold-light);
      background: rgba(34, 10, 14, 0.55);
      backdrop-filter: blur(6px);
      border-radius: 0 18px 18px 0;
    }

    .photo-story-card[data-align="right-ornament"] .overlay-text {
      text-align: right;
      margin-left: auto;
      max-width: 92%;
      border-right: 3px solid var(--gold-light);
      padding-right: 22px;
    }

    .photo-story-card[data-align="gold-card"] .overlay-text {
      text-align: center;
      margin-left: 22px;
      margin-right: 22px;
      padding: 20px 22px;
      border: 1px solid rgba(240, 215, 163, 0.55);
      background: rgba(26, 8, 11, 0.58);
      backdrop-filter: blur(6px);
      border-radius: 18px;
    }

    .photo-story-card[data-align="closing-crest"] .overlay-text {
      text-align: center;
      margin-left: auto;
      margin-right: auto;
      max-width: 90%;
      padding-top: 22px;
      border-top: 1px solid rgba(240, 215, 163, 0.45);
    }

    .tag-pill {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(196, 152, 78, 0.24);
      border: 1px solid rgba(240, 215, 163, 0.45);
      color: var(--gold-light);
      margin-bottom: 10px;
    }

    .overlay-text h3 {
      font-size: clamp(1.55rem, 3.6vw, 2.25rem);
      line-height: 1.18;
      color: #fff;
      margin-bottom: 8px;
    }

    .quote-line {
      font-family: 'Cormorant Garamond', serif;
